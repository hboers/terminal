# Beispiel für /etc/nginx/sites-available/terminal
# Socket-Version an die installierte PHP-FPM-Version anpassen.
server {
    listen 80;
    listen [::]:80;
    server_name terminal.example.com;

    root /var/www/html/terminal;
    index index.php;

    location = / {
        try_files /index.php =404;
    }

    # Das Arbeitsverzeichnis enthält ausführbare Nutzerskripte und darf
    # niemals direkt über HTTP erreichbar sein.
    location ^~ /home/ {
        deny all;
    }

    # Keine Projekt- oder Geheimdateien ausliefern.
    location ~ /.(?!well-known) {
        deny all;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    location / {
        try_files $uri =404;
    }
}
